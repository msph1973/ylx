name: Junie Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

concurrency:
  # Scoped by event_name too: without this, an unrelated bot posting a plain
  # comment on the PR (issue_comment event, sharing the same PR/issue number)
  # cancelled the in-progress pull_request-triggered review run before it
  # could finish — even though that issue_comment job almost always no-ops
  # (its `if` gate below requires an explicit "@junie-agent code-review"
  # comment). Multiple pushes/comments of the SAME event type still
  # cancel-in-progress each other as intended; only cross-event-type
  # cancellation is prevented.
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}-${{ github.event_name }}"
  cancel-in-progress: true

jobs:
  review:
    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '@junie-agent') &&
        contains(github.event.comment.body, 'code-review') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Run Junie code review
        uses: JetBrains/junie-github-action@3f199e1f3449f01ca19cfa4ba7ff911588e90999 # v0
        continue-on-error: true
        with:
          junie_api_key: ${{ secrets.JUNIE_API_KEY }}
          prompt: code-review
          use_single_comment: true
          model: gemini-flash
