name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @ylx/web typecheck

      - name: Lint
        run: pnpm --filter @ylx/web lint

      - name: Hydration leak guard (no sensitive client:* props)
        run: pnpm --filter @ylx/web check:hydration-leak

      - name: Unit tests
        run: pnpm --filter @ylx/web test

      - name: Build
        run: pnpm --filter @ylx/web build
