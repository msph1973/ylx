name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege by default for every job's GITHUB_TOKEN (CodeQL: workflows
# should set an explicit permissions block). Jobs may narrow further.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @ylx/web typecheck

      - name: Lint
        run: pnpm --filter @ylx/web lint

      - name: Hydration leak guard (no sensitive client:* props)
        run: pnpm --filter @ylx/web check:hydration-leak

      - name: Unit tests
        run: pnpm --filter @ylx/web test

      - name: Build
        run: pnpm --filter @ylx/web build

  e2e:
    runs-on: ubuntu-latest
    # Skip when the Sanity credential is unavailable: fork PRs and Dependabot
    # runs don't receive Actions secrets, so the seed step would fail. Those
    # changes are covered by the trusted push run on master instead.
    if: github.event_name == 'push' || (github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)
    # Least privilege: this job only reads the repo (artifact upload uses the
    # actions API, not GITHUB_TOKEN contents scope).
    permissions:
      contents: read
    env:
      # Non-secret build inputs stay at job scope. SANITY_API_TOKEN is NOT here
      # so it's never exposed to `pnpm install` lifecycle scripts (a malicious
      # dependency could otherwise exfiltrate it); it's injected only into the
      # seed and test steps that actually need it.
      PUBLIC_SANITY_PROJECT_ID: 741sif2l
      PUBLIC_SANITY_DATASET: test
      # CI-only session secret — not a production credential. Must be the same
      # value for the dev server (SESSION_SECRET) and the cookie-signing test
      # helper (PLAYWRIGHT_SESSION_SECRET).
      SESSION_SECRET: ylx-ci-e2e-session-secret
      PLAYWRIGHT_SESSION_SECRET: ylx-ci-e2e-session-secret
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright chromium
        run: pnpm --filter @ylx/web exec playwright install --with-deps chromium

      - name: Seed e2e admin fixture
        run: node apps/web/scripts/seed-e2e-admin.mjs
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN_E2E }}

      - name: Run Playwright tests
        run: pnpm --filter @ylx/web test:e2e
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN_E2E }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
